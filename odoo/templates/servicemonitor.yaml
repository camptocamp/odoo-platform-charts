{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ template "odoo.name" . }}
  labels:
    app: {{ template "odoo.name" . }}
    release: "{{ .Release.Name }}"
    {{- include "odoo.labels" $ | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: metrics
    path: "/metrics"
    interval: {{ .Values.odoo.metrics.scrapeInterval }}
{{- end }}
{{- if .Values.serviceMonitorOdooMetrics.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ template "odoo.name" . }}-odoo-metrics
  labels:
    app: {{ template "odoo.name" . }}
    release: "{{ .Release.Name }}"
    {{- include "odoo.labels" $ | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: http
    path: "/metrics"
    interval: {{ .Values.serviceMonitorOdooMetrics.scrapeInterval | default .Values.odoo.metrics.scrapeInterval }}
{{- end }}
